<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ずんだもんニュース7月25日 V01</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; background:#000; overflow:hidden; font-family:"Yu Mincho","Hiragino Mincho ProN",serif; }
  #stage { position:fixed; inset:0; background:#000; user-select:none; cursor:pointer; }
  #bgA,#bgB { position:absolute; inset:0; transition:opacity 1.2s; }
  #bgB { opacity:0; }
  .scene-emoji { position:absolute; font-size:min(38vw,300px); opacity:.24; filter:blur(1px); pointer-events:none; }
  #vignette { position:absolute; inset:0; pointer-events:none; background:radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.72) 100%); }
  #book { position:absolute; left:50%; transform:translateX(-50%); bottom:2.5%; width:min(94vw,860px); max-height:46%;
    background:linear-gradient(175deg,#f5eeda,#e8dfc8); border-radius:6px;
    box-shadow:0 6px 30px rgba(0,0,0,.8), inset 0 0 60px rgba(120,90,40,.15);
    padding:18px 24px 30px; color:#2b2320; }
  #book:before { content:""; position:absolute; left:0; top:0; bottom:0; width:14px;
    background:linear-gradient(90deg,rgba(90,60,30,.35),transparent); border-radius:6px 0 0 6px; }
  #speaker { font-size:.85em; color:#3d7d26; margin-bottom:4px; font-weight:bold; }
  #txt { font-size:clamp(15px,2.5vh,19px); line-height:1.95; letter-spacing:.04em; white-space:pre-wrap; min-height:3.9em; overflow-y:auto; max-height:30vh; }
  #next { position:absolute; right:16px; bottom:8px; font-size:13px; color:#9a7c4b; animation:bob 1.1s infinite; }
  @keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(4px)} }
  #shiori { position:absolute; top:0; right:14px; width:44px; padding:10px 4px 14px;
    background:linear-gradient(#2e6b1f,#1c4a12); border-radius:0 0 8px 8px;
    box-shadow:0 3px 10px rgba(0,0,0,.6); color:#e9f5d8; text-align:center; font-size:11px; z-index:30; }
  #shiori .day { font-size:14px; font-weight:bold; margin-bottom:4px; }
  #shiori .ch { font-size:16px; font-weight:bold; margin-top:4px; }
  #voicebtn { position:absolute; top:8px; left:12px; z-index:30; font-family:inherit;
    background:rgba(20,30,12,.65); color:#e9f5d8; border:1px solid rgba(200,230,160,.5);
    border-radius:20px; padding:7px 14px; font-size:13px; cursor:pointer; }
  #voicebtn.on { background:#3d7d26; }
  #title { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; z-index:20;
    background:radial-gradient(ellipse at 50% 35%, #274d17 0%, #12240a 55%, #050a03 100%); transition:opacity 1s; }
  #title h1 { color:#eaf6d8; font-size:clamp(26px,6vw,44px); letter-spacing:.14em; text-shadow:0 0 18px rgba(140,220,80,.5); }
  #title .sub { color:#9fc37e; font-size:clamp(13px,2.4vw,16px); letter-spacing:.3em; }
  #title .ver { color:#6f9a54; font-size:13px; letter-spacing:.2em; }
  #title .tap { margin-top:26px; color:#d9edc0; font-size:15px; animation:bob 1.3s infinite; border:1px solid rgba(200,230,160,.5); border-radius:24px; padding:10px 26px; }
  #title .zunda { font-size:min(24vw,150px); filter:drop-shadow(0 0 24px rgba(140,220,80,.45)); }
  .hide { opacity:0; pointer-events:none; }
  #endlinks { position:absolute; left:50%; transform:translateX(-50%); bottom:52%; display:none; flex-direction:column; gap:12px; z-index:25; width:min(90vw,540px); }
  #endlinks a { font-family:inherit; text-align:center; color:#f3e9cf; text-shadow:0 0 8px #000; background:rgba(20,30,10,.6);
    border:1px solid rgba(240,220,170,.45); border-radius:4px; padding:12px 16px; text-decoration:none; font-size:clamp(14px,2.4vh,18px); }
</style>
</head>
<body>
<div id="stage">
  <div id="bgA"></div><div id="bgB"></div>
  <div id="vignette"></div>
  <div id="shiori"><div class="day">7/25</div>ニュース<div class="ch" id="chnum">-</div><div style="margin-top:4px;">／5</div></div>
  <button id="voicebtn" type="button">🔊 ナレーション OFF</button>
  <div id="endlinks">
    <a href="../">📰 くわしい版（造園屋デイリー情報）を読むのだ</a>
    <a href="../backnumber/">📚 バックナンバーなのだ</a>
  </div>
  <div id="book">
    <div id="speaker">ずんだもん</div>
    <div id="txt"></div>
    <div id="next">▼ タップでつぎへ</div>
  </div>
  <div id="title">
    <div class="zunda">🫛</div>
    <h1>ずんだもんニュース</h1>
    <div class="sub">— 7月25日 —</div>
    <div class="ver">V01 ｜ みどり造園 造園屋デイリー情報より</div>
    <div class="tap">タップではじめるのだ</div>
  </div>
</div>
<script>
/* ======== シーン背景（CSS描画） ======== */
const SCENES = {
  op:    {bg:"radial-gradient(ellipse at 50% 30%, #3b6f24 0%, #1c3a10 60%, #0a1505 100%)", emoji:"🫛", pos:"right:6%; bottom:10%;"},
  hachi: {bg:"linear-gradient(180deg,#1a2410 0%,#2c3a14 45%,#0e1407 100%)", emoji:"🐝", pos:"right:4%; top:8%;"},
  fair:  {bg:"linear-gradient(180deg,#2a1f3d 0%,#4a3568 40%,#1a1230 100%)", emoji:"🎪", pos:"left:6%; bottom:14%;"},
  kage:  {bg:"linear-gradient(180deg,#12291c 0%,#1e4030 50%,#0a1a10 100%)", emoji:"🌸", pos:"right:8%; bottom:12%;"},
  aoi:   {bg:"linear-gradient(180deg,#16233d 0%,#2a3f66 50%,#0c1424 100%)", emoji:"💠", pos:"left:8%; top:12%;"},
  mizu:  {bg:"linear-gradient(180deg,#3d2a14 0%,#6b4a1e 35%,#1e2a3d 75%,#0c1420 100%)", emoji:"💧", pos:"right:6%; bottom:16%;"},
  ed:    {bg:"radial-gradient(ellipse at 50% 70%, #4a7a2a 0%, #24460f 55%, #0a1505 100%)", emoji:"🌙", pos:"right:10%; top:8%;"}
};
/* ======== 台本 ======== */
const SCRIPT = [
  {s:"op", ch:"-", t:"やっほーなのだ。ずんだもんなのだ。\n今日は7月25日、土曜日なのだ。"},
  {s:"op", ch:"-", t:"みどり造園の「造園屋デイリー情報」から、今日のニュースを5本、ボクが読み上げていくのだ。\nゆっくり聞いてほしいのだ。"},

  {s:"hachi", ch:"1", t:"ひとつめのニュースなのだ。\n——スズメバチの季節が、本格的にはじまったのだ。"},
  {s:"hachi", ch:"1", t:"7月はスズメバチの巣がぐんぐん大きくなって、働きバチが一気に増える時期なのだ。\n8月から9月には、巣の大きさも攻撃性もピークになるのだ。"},
  {s:"hachi", ch:"1", t:"こわいのは「引っ越し」なのだ。\n昨日まで何もなかった生垣や庭木の中に、いつの間にか巣ができていることがあるのだ。"},
  {s:"hachi", ch:"1", t:"それを知らずにハサミやトリマーを入れて刺される事故が、毎年起きているのだ。\n今年は猛暑でハチの動きが活発だという指摘もあるのだ。"},
  {s:"hachi", ch:"1", t:"だから、お願いなのだ。\n作業の前に、枝の中・軒下・植込みの根元を、1分だけ見回ってほしいのだ。\nハチの出入りが一か所に集中していたら、それは巣のサインなのだ。触らず、親方に報告なのだ。"},

  {s:"fair", ch:"2", t:"ふたつめのニュースなのだ。\n——この秋、京都で日本最大級の緑のお祭りがあるのだ。"},
  {s:"fair", ch:"2", t:"「全国都市緑化フェア in 京都丹波」なのだ。\n亀岡市・南丹市・京丹波町で、2026年の秋に開催されるのだ。"},
  {s:"fair", ch:"2", t:"いま会場では、台湾の竹アートや藁アートの設置が進んでいるのだ。\n世界のチェルシーフラワーショーで金賞をいくつも獲った、石原和幸さんのメインガーデンも作られる予定なのだ。"},
  {s:"fair", ch:"2", t:"一流の庭を実物で見るのは、写真100枚より勉強になるのだ。\n豊田からは日帰り圏内なのだ。秋の研修旅行の候補に、どうぞなのだ。"},

  {s:"kage", ch:"3", t:"みっつめは、今日の誕生花なのだ。\n——7月25日の誕生花は「インパチェンス」なのだ。"},
  {s:"kage", ch:"3", t:"花言葉は「鮮やかな人」「強い個性」なのだ。\nこの花のえらいところは、日陰でもよく咲くことなのだ。"},
  {s:"kage", ch:"3", t:"夏の花はだいたい日なたが好きだから、建物の北側や木の下を彩れる花は、貴重な戦力なのだ。\n春から晩秋まで咲き続けて、こんもり茂って雑草も抑えてくれるのだ。"},
  {s:"kage", ch:"3", t:"「うちの庭は日陰だから花は無理」と諦めているお客様には、インパチェンスとギボウシの日陰花壇セットを提案するのだ。\n日陰は弱点じゃなくて、チャンスなのだ。"},

  {s:"aoi", ch:"4", t:"よっつめなのだ。\n——もうひとつの誕生花、「セイヨウニンジンボク」なのだ。"},
  {s:"aoi", ch:"4", t:"花の少ない真夏に、ラベンダーみたいな青紫の花穂を咲かせる、貴重な花木なのだ。\n暑さにも乾燥にも強くて、病害虫も少ない優等生なのだ。"},
  {s:"aoi", ch:"4", t:"いま、シンボルツリーとして人気が急上昇中なのだ。\nミツバチさんやチョウチョもよく集まるのだ。"},
  {s:"aoi", ch:"4", t:"「夏も花が楽しめる木」と言われたら、サルスベリだけじゃなくて、この木も出せると提案の幅が広がるのだ。\n白い壁の洋風のお家に、特に映えるのだ。"},

  {s:"mizu", ch:"5", t:"さいごのニュースなのだ。\n——真夏の水やりは、「夕方たっぷり」が正解なのだ。"},
  {s:"mizu", ch:"5", t:"水やりの基本は朝、とよく言うのだ。\nでも40℃級の猛暑が続く時期は、夕方17時以降に株元へたっぷり、葉水もいっしょに、がプロのおすすめなのだ。"},
  {s:"mizu", ch:"5", t:"朝の水は日中に乾いてしまって、かえって水切れになることがあるのだ。\n昼の水やりは土の中でお湯になって根を傷めるから、絶対にダメなのだ。"},
  {s:"mizu", ch:"5", t:"株元のマルチングで乾燥を防ぐこと、鉢をコンクリートに直置きしないことも効くのだ。\n植えたばかりの木ほど水切れに弱いから、今年植栽したお客様には「夕方たっぷり」を伝えてほしいのだ。"},

  {s:"ed", ch:"-", t:"今日のニュースは以上なのだ。\nまとめると——ハチに気をつけて、水は夕方、日陰には花を、秋は京都で勉強、なのだ。"},
  {s:"ed", ch:"-", t:"今日も暑くなるのだ。無理せず、休憩しながらがんばるのだ。\nずんだもんニュース7月25日、これでおしまいなのだ。\nまた聞いてほしいのだ〜。", end:true}
];
/* ======== エンジン ======== */
const bgA=document.getElementById('bgA'), bgB=document.getElementById('bgB');
const txt=document.getElementById('txt'), nextEl=document.getElementById('next');
const chnum=document.getElementById('chnum'), titleEl=document.getElementById('title');
const endlinks=document.getElementById('endlinks'), voicebtn=document.getElementById('voicebtn');
let idx=-1, typing=null, curScene="", frontA=true, started=false, voiceOn=false, ended=false;

function setScene(key){
  if(key===curScene) return; curScene=key;
  const sc=SCENES[key];
  const html='<div style="position:absolute;inset:0;background:'+sc.bg+'"></div><div class="scene-emoji" style="'+sc.pos+'">'+sc.emoji+'</div>';
  const showEl=frontA?bgB:bgA, hideEl=frontA?bgA:bgB;
  showEl.innerHTML=html; showEl.style.opacity=1; hideEl.style.opacity=0; frontA=!frontA;
}
function speak(text){
  if(!voiceOn||!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text.replace(/\n/g,'、'));
  u.lang='ja-JP'; u.rate=1.02; u.pitch=1.25;
  const v=speechSynthesis.getVoices().find(v=>v.lang&&v.lang.startsWith('ja'));
  if(v) u.voice=v;
  speechSynthesis.speak(u);
}
function showLine(){
  const line=SCRIPT[idx];
  setScene(line.s); chnum.textContent=line.ch;
  clearInterval(typing); txt.textContent=''; nextEl.style.visibility='hidden';
  let i=0;
  typing=setInterval(()=>{
    txt.textContent=line.t.slice(0,++i);
    if(i>=line.t.length){ clearInterval(typing); typing=null; nextEl.style.visibility='visible';
      if(line.end){ ended=true; endlinks.style.display='flex'; nextEl.textContent='▼ さいしょから'; } }
  },28);
  speak(line.t);
}
function advance(){
  if(!started){ started=true; titleEl.classList.add('hide'); idx=0; showLine(); return; }
  if(typing){ clearInterval(typing); typing=null; txt.textContent=SCRIPT[idx].t; nextEl.style.visibility='visible';
    if(SCRIPT[idx].end){ ended=true; endlinks.style.display='flex'; nextEl.textContent='▼ さいしょから'; } return; }
  if(ended){ ended=false; endlinks.style.display='none'; nextEl.textContent='▼ タップでつぎへ'; idx=0; showLine(); return; }
  if(idx<SCRIPT.length-1){ idx++; showLine(); }
}
document.getElementById('stage').addEventListener('click',e=>{
  if(e.target.closest('#voicebtn')||e.target.closest('#endlinks')) return;
  advance();
});
voicebtn.addEventListener('click',()=>{
  voiceOn=!voiceOn;
  voicebtn.textContent=voiceOn?'🔊 ナレーション ON':'🔊 ナレーション OFF';
  voicebtn.classList.toggle('on',voiceOn);
  if(!voiceOn) speechSynthesis.cancel();
  else if(started&&idx>=0) speak(SCRIPT[idx].t);
});
if('speechSynthesis' in window){ speechSynthesis.getVoices(); }
setScene('op');
</script>
</body>
</html>
